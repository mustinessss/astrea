<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Астрея — Вход</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #111827;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Фоновая сетка */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Фиолетовое свечение */
        body::after {
            content: '';
            position: absolute;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: #1f2937;
            border: 1px solid #374151;
            border-top: 2px solid #8b5cf6;
            padding: 48px 40px 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo svg {
            width: 28px;
            height: 28px;
            color: #8b5cf6;
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #fff;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 13px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 36px;
            padding-left: 40px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #374151;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 0;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 1px #8b5cf6;
        }

        input::placeholder {
            color: #4b5563;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 13px 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #8b5cf6;
            color: #fff;
        }

        .btn-primary:hover {
            background: #7c3aed;
        }

        .btn-ghost {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
        }

        .btn-ghost:hover {
            border-color: #6b7280;
            color: #fff;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 13px;
            padding: 12px 14px;
            margin-bottom: 24px;
            letter-spacing: 0.02em;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #4b5563;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 17.5L3 6V3h3l11.5 11.5"/>
                <path d="M13 19l6-6"/>
                <path d="M16 16l4 4"/>
                <path d="M19 21l2-2"/>
            </svg>
            <span class="logo-text">Astrea</span>
        </div>
        <p class="subtitle">Система судейства фехтования</p>
        <div class="divider"></div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="judge@example.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary">Войти</button>
                <button type="button" class="btn btn-ghost" onclick="window.location.href='/viewer'">Просмотр</button>
            </div>
        </form>

        <p class="footer-note">Для получения доступа обратитесь к главному судье</p>
    </div>
</body>
</html>
